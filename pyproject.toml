[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "visual-link"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "reedsolo==1.7.0", "opencv-python-headless==4.12.0.88"]
[project.scripts]
visual-link = "visual_link.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
visual_link = ["web.html"]
